name: Test LLM Orchestrator

on:
  workflow_dispatch: {}

jobs:
  run-test:
    name: Run test_llm_orchestrator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai

      - name: Run test orchestrator
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -e
          python tools/test_llm_orchestrator.py || true

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          latest=$(ls -t tools/llm_test_results/llm_orchestrator_results_*.json 2>/dev/null | head -n1 || true)
          if [ -n "$latest" ]; then
            cp "$latest" artifacts/llm_orchestrator_test_results.json
            echo "Found result: $latest"
          else
            echo "No result file found in tools/llm_test_results"
          fi

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: llm_orchestrator_test_results
          path: artifacts/llm_orchestrator_test_results.json
